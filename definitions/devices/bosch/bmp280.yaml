id: bmp280

name: BMP280

vendor: bosch

buses:
  - i2c
  - spi

addresses:
  - "0x76"
  - "0x77"

chip_id: "0x58"

driver_module: sensora.drivers.bmp280

description: >
  Bosch digital barometric pressure sensor providing
  temperature and pressure measurements.

metadata:
  category: environmental

  measurements:
    - temperature
    - pressure

  operating_voltage:
    min: 1.71
    typ: 1.80
    max: 3.60
    unit: V

  operating_temperature:
    min: -40
    max: 85
    unit: C

  resolution:
    temperature:
      value: 0.01
      unit: C

    pressure:
      value: 0.18
      unit: Pa

  package: LGA-8

  datasheet: https://www.bosch-sensortec.com/products/environmental-sensors/pressure-sensors/bmp280/

  features:
    - temperature
    - pressure
    - oversampling
    - digital_filter
    - standby_modes
    - forced_mode
    - normal_mode
    - sleep_mode

  notes:
    - Address is selected using the SDO pin.
    - 0x76 when SDO is LOW.
    - 0x77 when SDO is HIGH.
    - Compatible with many BME280 software interfaces except humidity measurement.
