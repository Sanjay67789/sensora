id: tmp117

name: TMP117

vendor: texas_instruments

buses:
  - i2c

addresses:
  - "0x48"
  - "0x49"
  - "0x4A"
  - "0x4B"

chip_id: null

driver_module: sensora.drivers.tmp117

description: >
  Texas Instruments TMP117 high-precision digital temperature
  sensor offering excellent accuracy over a wide operating
  range with an I2C-compatible interface and programmable
  alert functionality.

metadata:
  category: temperature_sensor

  measurements:
    - temperature

  operating_voltage:
    min: 1.8
    typ: 3.3
    max: 5.5
    unit: V

  operating_temperature:
    min: -55
    max: 150
    unit: C

  measurement_range:
    min: -55
    max: 150
    unit: C

  accuracy:
    typ: "±0.1°C (−20°C to +50°C)"
    max: "±0.3°C"

  resolution:
    value: 16
    unit: bit

  package: WSON-6

  datasheet: https://www.ti.com/product/TMP117

  features:
    - temperature_sensor
    - high_precision
    - low_power
    - shutdown_mode
    - one_shot_conversion
    - programmable_alert
    - eeprom
    - offset_calibration
    - smbus_compatible

  notes:
    - Supports four selectable I2C addresses via the ADD0 pin.
    - Address is selected by connecting ADD0 to GND, VCC, SDA, or SCL.
    - Factory calibrated with no external calibration required.
    - Does not provide a dedicated WHO_AM_I or CHIP_ID register.
