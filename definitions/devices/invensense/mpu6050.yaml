id: mpu6050

name: MPU6050

vendor: invensense

buses:
  - i2c

addresses:
  - "0x68"
  - "0x69"

chip_id: "0x68"

driver_module: sensora.drivers.mpu6050

description: >
  InvenSense 6-axis MotionTracking device integrating a
  3-axis accelerometer and 3-axis gyroscope with an
  embedded Digital Motion Processor (DMP).

metadata:
  category: imu

  measurements:
    - acceleration
    - angular_velocity
    - temperature

  operating_voltage:
    min: 2.375
    typ: 3.30
    max: 3.46
    unit: V

  operating_temperature:
    min: -40
    max: 85
    unit: C

  accelerometer_range:
    - "±2g"
    - "±4g"
    - "±8g"
    - "±16g"

  gyroscope_range:
    - "±250°/s"
    - "±500°/s"
    - "±1000°/s"
    - "±2000°/s"

  package: QFN-24

  datasheet: https://invensense.tdk.com/products/motion-tracking/6-axis/mpu-6050/

  features:
    - 3_axis_accelerometer
    - 3_axis_gyroscope
    - digital_motion_processor
    - fifo
    - interrupt
    - wake_on_motion
    - self_test
    - temperature_sensor

  notes:
    - AD0 pin selects the I2C address.
    - 0x68 when AD0 is LOW.
    - 0x69 when AD0 is HIGH.
    - Widely used in robotics, drones, and embedded systems.
