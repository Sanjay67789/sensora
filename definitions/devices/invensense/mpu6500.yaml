id: mpu6500

name: MPU6500

vendor: invensense

buses:
  - i2c
  - spi

addresses:
  - "0x68"
  - "0x69"

chip_id: "0x70"

driver_module: sensora.drivers.mpu6500

description: >
  InvenSense 6-axis MotionTracking device integrating a
  3-axis accelerometer and 3-axis gyroscope with enhanced
  performance, low power consumption, and an embedded
  Digital Motion Processor (DMP).

metadata:
  category: imu

  measurements:
    - acceleration
    - angular_velocity
    - temperature

  operating_voltage:
    min: 1.71
    typ: 1.80
    max: 3.60
    unit: V

  operating_temperature:
    min: -40
    max: 85
    unit: C

  accelerometer_range:
    - "±2g"
    - "±4g"
    - "±8g"
    - "±16g"

  gyroscope_range:
    - "±250°/s"
    - "±500°/s"
    - "±1000°/s"
    - "±2000°/s"

  package: QFN-24

  datasheet: https://invensense.tdk.com/products/motion-tracking/6-axis/mpu-6500/

  features:
    - 3_axis_accelerometer
    - 3_axis_gyroscope
    - digital_motion_processor
    - fifo
    - interrupt
    - wake_on_motion
    - self_test
    - temperature_sensor
    - low_power
    - spi

  notes:
    - AD0 pin selects the I2C address.
    - 0x68 when AD0 is LOW.
    - 0x69 when AD0 is HIGH.
    - Supports both I2C and SPI interfaces.
    - Successor to the MPU6050 with improved performance and lower power consumption.
