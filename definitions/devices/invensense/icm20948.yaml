id: icm20948

name: ICM20948

vendor: invensense

buses:
  - i2c
  - spi

addresses:
  - "0x68"
  - "0x69"

chip_id: "0xEA"

driver_module: sensora.drivers.icm20948

description: >
  TDK InvenSense 9-axis MotionTracking device integrating a
  3-axis accelerometer, 3-axis gyroscope, and a 3-axis
  magnetometer. Designed for wearable, robotics, drone,
  IoT, and industrial motion sensing applications.

metadata:
  category: imu

  measurements:
    - acceleration
    - angular_velocity
    - magnetic_field
    - temperature

  operating_voltage:
    min: 1.71
    typ: 1.80
    max: 3.60
    unit: V

  operating_temperature:
    min: -40
    max: 85
    unit: C

  accelerometer_range:
    - "±2g"
    - "±4g"
    - "±8g"
    - "±16g"

  gyroscope_range:
    - "±250°/s"
    - "±500°/s"
    - "±1000°/s"
    - "±2000°/s"

  magnetometer:
    model: AK09916

    range:
      - "±4900 µT"

    resolution:
      - "16-bit"

  package: QFN-24

  datasheet: https://invensense.tdk.com/products/motion-tracking/9-axis/icm-20948/

  features:
    - 3_axis_accelerometer
    - 3_axis_gyroscope
    - 3_axis_magnetometer
    - digital_motion_processor
    - fifo
    - interrupt
    - self_test
    - wake_on_motion
    - low_power
    - spi
    - i2c
    - temperature_sensor

  notes:
    - AD0 pin selects the I2C address.
    - 0x68 when AD0 is LOW.
    - 0x69 when AD0 is HIGH.
    - Integrated AK09916 3-axis magnetometer.
    - Supports both I2C and SPI interfaces.
    - Suitable for wearable, robotics, drone, and industrial applications.
