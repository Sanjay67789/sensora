id: icm20689

name: ICM20689

vendor: invensense

buses:
  - i2c
  - spi

addresses:
  - "0x68"
  - "0x69"

chip_id: "0x98"

driver_module: sensora.drivers.icm20689

description: >
  TDK InvenSense high-performance 6-axis MotionTracking
  device integrating a 3-axis accelerometer and 3-axis
  gyroscope for precision motion sensing applications.

metadata:
  category: imu

  measurements:
    - acceleration
    - angular_velocity
    - temperature

  operating_voltage:
    min: 1.71
    typ: 1.80
    max: 3.60
    unit: V

  operating_temperature:
    min: -40
    max: 85
    unit: C

  accelerometer_range:
    - "±2g"
    - "±4g"
    - "±8g"
    - "±16g"

  gyroscope_range:
    - "±250°/s"
    - "±500°/s"
    - "±1000°/s"
    - "±2000°/s"

  package: LGA-24

  datasheet: https://invensense.tdk.com/products/motion-tracking/6-axis/icm-20689/

  features:
    - 3_axis_accelerometer
    - 3_axis_gyroscope
    - fifo
    - interrupt
    - self_test
    - wake_on_motion
    - low_power
    - high_performance
    - low_noise
    - spi
    - i2c
    - temperature_sensor

  notes:
    - AD0 pin selects the I2C address.
    - 0x68 when AD0 is LOW.
    - 0x69 when AD0 is HIGH.
    - Supports both I2C and SPI interfaces.
    - Optimized for low-noise, high-performance motion sensing.
