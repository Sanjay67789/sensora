id: ds18b20

name: DS18B20 Digital Temperature Sensor

vendor: maxim_integrated

description: >
  Digital 1-Wire temperature sensor with a unique 64-bit ROM address.
  Commonly used in embedded systems, IoT monitoring,
  industrial automation, and environmental sensing.

buses:
  - onewire

identification:
  method: family_code
  family_code: "28"

driver:
  module: sensora.drivers.ds18b20
  class: DS18B20Driver

measurements:
  - temperature

electrical:
  voltage:
    min: 3.0
    typical: 3.3
    max: 5.5
    unit: V

features:
  temperature_sensor: true
  waterproof_probe_support: true
  unique_rom_address: true
  parasite_power_support: true
  programmable_resolution: true

metadata:
  category: temperature_sensor
  family: DS18B20
  manufacturer: Maxim Integrated

  notes:
    - Uses the Dallas/Maxim 1-Wire communication protocol.
    - Identified by 1-Wire family code 0x28.
    - Each sensor has a globally unique 64-bit ROM identifier.
    - Temperature range: -55°C to +125°C.
    - Resolution configurable from 9-bit to 12-bit.
