id: lps22hh

name: LPS22HH

vendor: stmicroelectronics

buses:
  - i2c
  - spi
  - i3c

addresses:
  - "0x5C"
  - "0x5D"

chip_id: "0xB3"

driver_module: sensora.drivers.lps22hh

description: >
  STMicroelectronics LPS22HH ultra-compact MEMS pressure sensor
  providing high-resolution barometric pressure and temperature
  measurements with improved accuracy, lower noise, and support
  for I2C, SPI, and I3C communication.

metadata:
  category: pressure_sensor

  measurements:
    - pressure
    - temperature

  operating_voltage:
    min: 1.7
    typ: 1.80
    max: 3.6
    unit: V

  operating_temperature:
    min: -40
    max: 85
    unit: C

  measurement_range:
    pressure:
      min: 260
      max: 1260
      unit: hPa

    temperature:
      min: -40
      max: 85
      unit: C

  pressure_resolution:
    value: 24
    unit: bit

  package: HLGA-10

  datasheet: https://www.st.com/en/mems-and-sensors/lps22hh.html

  features:
    - pressure_sensor
    - temperature_sensor
    - fifo
    - interrupt
    - low_power
    - one_shot_conversion
    - auto_increment
    - data_ready
    - low_noise
    - i2c
    - spi
    - i3c

  notes:
    - Supports I2C, SPI, and I3C communication.
    - I2C address is selected using the SDO pin.
    - Address 0x5C when SDO is LOW.
    - Address 0x5D when SDO is HIGH.
    - WHO_AM_I register value is 0xB3.
    - Successor to the LPS22HB with improved noise performance and power efficiency.
