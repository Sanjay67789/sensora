id: ism330dhcx

name: ISM330DHCX

vendor: stmicroelectronics

buses:
  - i2c
  - spi
  - i3c

addresses:
  - "0x6A"
  - "0x6B"

chip_id: "0x6B"

driver_module: sensora.drivers.ism330dhcx

description: >
  STMicroelectronics ISM330DHCX industrial-grade 6-axis inertial
  measurement unit (IMU) integrating a 3-axis accelerometer and
  3-axis gyroscope. Designed for industrial IoT, predictive
  maintenance, robotics, and vibration monitoring with embedded
  Machine Learning Core (MLC), Finite State Machine (FSM), and
  Sensor Hub functionality.

metadata:
  category: imu

  measurements:
    - acceleration
    - angular_velocity
    - temperature

  operating_voltage:
    min: 1.71
    typ: 1.80
    max: 3.60
    unit: V

  operating_temperature:
    min: -40
    max: 105
    unit: C

  accelerometer_range:
    - "±2g"
    - "±4g"
    - "±8g"
    - "±16g"

  gyroscope_range:
    - "±125°/s"
    - "±250°/s"
    - "±500°/s"
    - "±1000°/s"
    - "±2000°/s"
    - "±4000°/s"

  package: LGA-14

  datasheet: https://www.st.com/en/mems-and-sensors/ism330dhcx.html

  features:
    - 3_axis_accelerometer
    - 3_axis_gyroscope
    - temperature_sensor
    - fifo
    - interrupt
    - self_test
    - machine_learning_core
    - finite_state_machine
    - sensor_hub
    - timestamp
    - activity_detection
    - vibration_monitoring
    - tilt_detection
    - wake_up_detection
    - free_fall_detection
    - tap_detection
    - double_tap_detection
    - significant_motion
    - low_power
    - i2c
    - spi
    - i3c

  notes:
    - Supports I2C, SPI, and I3C communication.
    - I2C address is selected using the SDO/SA0 pin.
    - Address 0x6A when SA0 is LOW.
    - Address 0x6B when SA0 is HIGH.
    - WHO_AM_I register value is 0x6B.
    - Industrial-grade IMU designed for predictive maintenance and vibration analysis.
    - Supports embedded Machine Learning Core (MLC) and Finite State Machine (FSM).
