id: lsm6ds3

name: LSM6DS3

vendor: stmicroelectronics

buses:
  - i2c
  - spi

addresses:
  - "0x6A"
  - "0x6B"

chip_id: "0x69"

driver_module: sensora.drivers.lsm6ds3

description: >
  STMicroelectronics LSM6DS3 low-power 6-axis inertial
  measurement unit (IMU) integrating a 3-axis accelerometer
  and a 3-axis gyroscope with embedded motion detection,
  FIFO buffering, and I2C/SPI interfaces.

metadata:
  category: imu

  measurements:
    - acceleration
    - angular_velocity
    - temperature

  operating_voltage:
    min: 1.71
    typ: 1.80
    max: 3.60
    unit: V

  operating_temperature:
    min: -40
    max: 85
    unit: C

  accelerometer_range:
    - "±2g"
    - "±4g"
    - "±8g"
    - "±16g"

  gyroscope_range:
    - "±125°/s"
    - "±245°/s"
    - "±500°/s"
    - "±1000°/s"
    - "±2000°/s"

  package: LGA-14

  datasheet: https://www.st.com/en/mems-and-sensors/lsm6ds3.html

  features:
    - 3_axis_accelerometer
    - 3_axis_gyroscope
    - fifo
    - interrupt
    - self_test
    - pedometer
    - step_detector
    - significant_motion
    - tilt_detection
    - wake_up_detection
    - free_fall_detection
    - tap_detection
    - double_tap_detection
    - spi
    - i2c
    - temperature_sensor
    - low_power

  notes:
    - Supports both I2C and SPI communication.
    - I2C address is selected using the SDO/SA0 pin.
    - Address 0x6A when SA0 is LOW.
    - Address 0x6B when SA0 is HIGH.
    - WHO_AM_I register value is 0x69.
