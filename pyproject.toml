[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensora"
version = "0.1.0"
description = "Embedded Hardware Discovery, Diagnostics, and Management Framework"
readme = "README.md"
requires-python = ">=3.11"

license = "MIT"
license-files = ["LICENSE"]

authors = [{ name = "Sanjay Kumar P" }]

keywords = [
    "embedded",
    "embedded-linux",
    "linux",
    "hardware",
    "raspberry-pi",
    "diagnostics",
    "device-discovery",
    "iot",
    "sensor",
    "automation",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Hardware",
]

dependencies = ["typer>=0.16", "rich>=14", "PyYAML>=6.0"]

[project.scripts]
sensora = "sensora.cli:app"

[project.urls]
Homepage = "https://github.com/Sanjay67789/sensora"
Repository = "https://github.com/Sanjay67789/sensora"
Issues = "https://github.com/Sanjay67789/sensora/issues"

[tool.setuptools.packages.find]
include = ["sensora*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
